<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign Up / Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            background-color: #fffef7;
        }
        .auth-card:hover { transform: translateY(-5px); }
        .auth-card .card-header {
            background-color: #c88fea;
            color: white;
            border-radius: 16px 16px 0 0;
            font-weight: bold;
            text-align: center;
        }
        .btn-primary { background-color: #c88fea; 
                       border: none;
                     }
        .btn-primary:hover {
                            background-color: #b06fd8;
                           }
        .form-label i {
                         width: 25px;
                        color: #c88fea; 
                      }

        
        html, body {
                      height: 100%; 
                      margin: 0; 
                     padding: 0; }
        body {
             display: flex;
              flex-direction: column;
               min-height: 100vh; }
        main { flex: 1; }
        footer { margin-top: auto;
                 width: 100%;
                 background-color: #333; 
                 color: white;
                 text-align: center; 
                 padding: 1rem; 
                }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-transparent bg-transparent">
            <div class="container">
                <a class="navbar-brand" href="index.html">Unwrap Crochets with Y2Kesa</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="Crochet-items.html">Crochet-items</a></li>
                        <li class="nav-item"><a class="nav-link" href="Pricelist.html">Pricelist</a></li>
                        <li class="nav-item"><a class="nav-link" href="AboutUs.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="ContactUs.html">Contact</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="SignUp-Login.html">Login/SignUp</a></li>
                        <li class="nav-item"><a class="nav-link" href="cart.html">🛒</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row g-4 justify-content-center">
            <!-- Sign Up Card -->
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card h-100">
                    <div class="card-header"><i class="fas fa-user-plus me-2"></i>Create Account</div>
                    <div class="card-body">
                        <form id="signupForm">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                                <input type="text" class="form-control" id="signupName" placeholder="Kesaobaka Tshotlego" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                                <input type="email" class="form-control" id="signupEmail" placeholder="hello@y2kesa.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                                <input type="password" class="form-control" id="signupPassword" placeholder="Create a password" minlength="6" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-check-circle"></i> Confirm Password</label>
                                <input type="password" class="form-control" id="signupConfirm" placeholder="Repeat password" required>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label small" for="termsCheck">I agree to the <a href="#">Terms & Privacy</a></label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
                        </form>
                        <div class="mt-3 text-center text-muted small">Already have an account? <a href="#" id="switchToLogin" class="text-decoration-none">Log in here</a></div>
                    </div>
                </div>
            </div>
            <!-- Login Card -->
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card h-100">
                    <div class="card-header"><i class="fas fa-sign-in-alt me-2"></i>Login</div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" class="form-control" id="loginEmail" placeholder="your@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                                <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Keep me logged in</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                        </form>
                        <div class="mt-3 text-center text-muted small">New to Y2Kesa? <a href="#" id="switchToSignup" class="text-decoration-none">Create an account</a></div>
                        <div class="text-center mt-2"><a href="#" class="small text-decoration-none">Forgot password?</a></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Kesaobaka Tshotlego | Y2Kesa – Handmade with Love</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        document.getElementById('switchToLogin')?.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.col-md-6:last-child').scrollIntoView({ behavior: 'smooth' });
        });
        document.getElementById('switchToSignup')?.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.col-md-6:first-child').scrollIntoView({ behavior: 'smooth' });
        });

        
        const signupForm = document.getElementById('signupForm');
        if (signupForm) {
            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const pwd = document.getElementById('signupPassword').value;
                const confirm = document.getElementById('signupConfirm').value;

                if (!name || !email || !pwd || !confirm) { alert('Please fill all fields.'); return; }
                if (pwd !== confirm) { alert('Passwords do not match.'); return; }
                if (pwd.length < 6) { alert('Password must be at least 6 characters.'); return; }

                const users = JSON.parse(localStorage.getItem('y2kesa_users') || '[]');
                if (users.find(u => u.email === email)) { alert('This email is already registered. Please log in.'); return; }

                users.push({ name, email, password: pwd });
                localStorage.setItem('y2kesa_users', JSON.stringify(users));
                localStorage.setItem('y2kesa_current_user', JSON.stringify({ name, email }));
                alert(`Welcome ${name}! Account created successfully.`);
                window.location.href = 'index.html';
            });
        }

        
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const pwd = document.getElementById('loginPassword').value;
                const users = JSON.parse(localStorage.getItem('y2kesa_users') || '[]');
                const user = users.find(u => u.email === email && u.password === pwd);
                if (user) {
                    localStorage.setItem('y2kesa_current_user', JSON.stringify({ name: user.name, email: user.email }));
                    alert(`Welcome back ${user.name}!`);
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid email or password. Please try again or sign up.');
                }
            });
        }
    </script>
</body>
</html>
